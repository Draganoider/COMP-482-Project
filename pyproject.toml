[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evac"
version = "0.1.0"
description = "Wildfire Evacuation Planner: max flow and min cut on Los Angeles roads (COMP 482 group project)"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added by the pull request that first uses them (AGENTS.md, Stack).
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "networkx>=3.2",  # reference implementation in tests only, never imported in src/
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Repository tooling shared with other projects: long regexes read better on one line.
".github/scripts/*" = ["E501"]
